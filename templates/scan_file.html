{% extends "base.html" %}{% block content %}<div class="panel p-4 mt-4"><h2 class="brand">فحص ملف</h2><p class="text-warning">سيتم إرسال الملف إلى VirusTotal وقد يُخزن أو يُشارك. لا ترفع ملفات خاصة أو سرية.</p><form method="post" enctype="multipart/form-data">{{ form.hidden_tag() }}<input class="form-control my-3" type="file" name="file" required><div class="form-check my-3">{{ form.consent(class="form-check-input") }}<label class="form-check-label">{{ form.consent.label.text }}</label></div><button class="btn btn-main">رفع وفحص الملف</button></form></div>{% endblock %}
