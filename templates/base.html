<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A1220">
<title>تَحَقَّق | منصة الفحص الأمني</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">

<style>
:root {
    --bg: #0A1220;
    --bg2: #12233B;
    --teal: #2DD4BF;
    --teal2: #08AFA5;
    --text: #F2F8FC;
    --muted: #B5C7D5;
    --glass: rgba(17, 48, 65, .78);
    --border: rgba(45, 212, 191, .24);
}

* { box-sizing: border-box; }

html, body {
    margin: 0;
    min-height: 100%;
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
}

body {
    background:
      radial-gradient(ellipse at 50% 30%, rgba(0,190,180,.13), transparent 48%),
      linear-gradient(145deg, var(--bg), var(--bg2), #061521);
    color: var(--text);
    font-family: 'Tajawal', Tahoma, Arial, sans-serif;
    position: relative;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .12;
    background-image: radial-gradient(#9afcf2 0.7px, transparent .7px);
    background-size: 23px 23px;
    z-index: 0;
}

.site {
    position: relative;
    z-index: 1;
    width: 100%;
    min-height: 100vh;
    padding: 20px 16px 35px;
}

.topbar {
    width: min(100%, 1050px);
    margin: 0 auto 28px;
    padding: 14px 20px;
    border: 1px solid var(--border);
    border-radius: 22px;
    background: rgba(10, 31, 47, .78);
    backdrop-filter: blur(16px);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
}

.logo {
    color: var(--teal);
    font-size: 27px;
    font-weight: 800;
    text-decoration: none;
    white-space: nowrap;
}

.nav-actions {
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
}

.nav-actions a {
    text-decoration: none;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 17px;
    min-height: 44px;
}

.nav-actions a.active,
.nav-actions a:hover {
    color: #041a20;
    background: var(--teal);
    border-color: var(--teal);
}

.page {
    width: min(100%, 920px);
    margin: 0 auto;
}

.glass-card {
    width: 100%;
    min-width: 0;
    padding: clamp(20px, 4vw, 42px);
    border: 1px solid rgba(45,212,191,.3);
    border-radius: 28px;
    background: linear-gradient(145deg,
        rgba(18, 55, 72, .88),
        rgba(8, 29, 46, .91));
    box-shadow:
        0 20px 55px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.07),
        0 0 30px rgba(45,212,191,.06);
    backdrop-filter: blur(16px);
    overflow: hidden;
}

.brand {
    color: var(--teal);
    font-weight: 800;
}

.muted { color: var(--muted); }

.hero {
    text-align: center;
    padding: 12px 0 25px;
}

.hero-icon {
    width: 160px;
    height: 160px;
    margin: 15px auto 24px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    font-size: 100px;
    background: radial-gradient(circle,
       rgba(45,212,191,.25),
       rgba(5,30,48,.08) 68%,
       transparent 70%);
    filter: drop-shadow(0 0 25px rgba(45,212,191,.5));
    animation: float 4s ease-in-out infinite;
}

.screen-art {
    text-align: center;
    font-size: 76px;
    padding: 8px 0 20px;
    color: var(--teal);
    filter: drop-shadow(0 0 20px rgba(45,212,191,.4));
}

@keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

.btn-main {
    min-height: 58px;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 13px 20px;
    color: #03201f;
    background: linear-gradient(110deg, #2DD4BF, #079D98);
    border: 1px solid rgba(45,212,191,.7);
    border-radius: 18px;
    font-size: 19px;
    font-weight: 800;
    text-decoration: none;
    box-shadow: 0 8px 24px rgba(0,190,170,.2);
    transition: transform .18s, box-shadow .18s;
}

.btn-main:hover {
    color: #03201f;
    box-shadow: 0 10px 30px rgba(0,220,190,.3);
    transform: translateY(-2px);
}

.btn-main:active { transform: scale(.98); }

.btn-secondary-glass {
    min-height: 58px;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    padding: 13px 20px;
    color: var(--text);
    background: rgba(45,212,191,.07);
    border: 1px solid var(--border);
    border-radius: 18px;
    font-size: 19px;
    font-weight: 700;
    text-decoration: none;
}

.form-label {
    color: var(--text);
    font-size: 17px;
    font-weight: 600;
}

.form-control {
    width: 100%;
    min-width: 0;
    min-height: 56px;
    padding: 13px 16px;
    color: var(--text) !important;
    background: rgba(27,65,82,.72) !important;
    border: 1px solid rgba(130,210,220,.35) !important;
    border-radius: 15px;
    font-family: inherit;
    font-size: 16px;
}

.form-control:focus {
    border-color: var(--teal) !important;
    box-shadow: 0 0 0 3px rgba(45,212,191,.13) !important;
}

.form-control::placeholder { color: #91A8B7; }

.form-check {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 48px;
    padding-right: 0;
}

.form-check-input {
    float: none !important;
    flex: 0 0 22px;
    width: 22px;
    height: 22px;
    margin: 0 !important;
    background-color: #15394a;
    border: 2px solid var(--teal);
}

.form-check-input:checked {
    background-color: var(--teal);
    border-color: var(--teal);
}

.form-check-label {
    color: var(--text);
    font-size: 18px;
    font-weight: 600;
}

.privacy {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 17px;
    margin: 20px 0;
    background: rgba(45,212,191,.075);
    border: 1px solid rgba(45,212,191,.12);
    border-radius: 17px;
    color: var(--muted);
    line-height: 1.8;
    font-size: 14px;
}

.lock-icon {
    flex: 0 0 43px;
    width: 43px;
    height: 43px;
    display: grid;
    place-items: center;
    border-radius: 13px;
    background: rgba(45,212,191,.13);
    font-size: 22px;
}

.flash-error {
    background: #642b3a;
    color: white;
    border-radius: 12px;
    padding: 13px;
    margin-bottom: 15px;
}

footer {
    text-align: center;
    color: var(--muted);
    padding: 30px 10px 10px;
    font-size: 14px;
}

@media (min-width: 768px) {
    .site { padding-top: 35px; }
    .hero-icon { width: 190px; height: 190px; font-size: 120px; }
}

@media (max-width: 576px) {
    .site { padding: 10px 10px 25px; }
    .topbar {
        padding: 12px;
        margin-bottom: 18px;
        flex-direction: column;
    }
    .logo { font-size: 25px; }
    .nav-actions { width: 100%; }
    .nav-actions a {
        flex: 1;
        text-align: center;
        padding: 10px 7px;
        font-size: 14px;
    }
    .glass-card { border-radius: 23px; }
    .hero-icon { width: 125px; height: 125px; font-size: 82px; }
    .screen-art { font-size: 62px; }
    .btn-main, .btn-secondary-glass { font-size: 17px; }
    .privacy { padding: 13px; font-size: 13px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>
<div class="site">

<header class="topbar">
    <a class="logo" href="/">🛡️ تَحَقَّق</a>

    <nav class="nav-actions">
        <a href="{{ url_for('scan_url') }}"
           class="{% if request.endpoint == 'scan_url' %}active{% endif %}">
           🔗 فحص رابط
        </a>
        <a href="{{ url_for('scan_file') }}"
           class="{% if request.endpoint == 'scan_file' %}active{% endif %}">
           📄 فحص ملف
        </a>
    </nav>
</header>

<main class="page">

{% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
        <div class="flash-error">{{ message }}</div>
    {% endfor %}
{% endwith %}

{% block content %}{% endblock %}

</main>

<footer>
    تَحَقَّق | منصة الفحص الأمني
</footer>

</div>
</body>
</html>
