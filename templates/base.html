<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>تَحَقَّق | مركز الفحص الأمني</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #081321;
            color: #f3f8fc;
            font-family: Tahoma, Arial;
        }

        .navbar,
        .panel {
            background: #102338;
            border: 1px solid #24516b;
            border-radius: 16px;
        }

        .brand {
            color: #48e5d0;
            font-weight: bold;
        }

        .muted {
            color: #a9bdce;
        }

        .btn-main {
            background: #147d82;
            color: white;
        }

        .btn-main:hover {
            background: #17616a;
            color: white;
        }

        .form-control {
            background: #18344d;
            color: white;
            border-color: #31536d;
        }

        .form-control:focus {
            background: #18344d;
            color: white;
        }

        .table {
            color: #f3f8fc;
        }

        .flash-error {
            background: #642b3a;
            color: white;
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<nav class="navbar m-3 p-3">

    <a class="navbar-brand brand" href="/">
        🛡️ تَحَقَّق
    </a>

    <div class="ms-auto">

        <a
            class="btn btn-outline-info btn-sm"
            href="{{ url_for('scan_url') }}"
        >
            🔗 فحص رابط
        </a>

        <a
            class="btn btn-outline-info btn-sm"
            href="{{ url_for('scan_file') }}"
        >
            📄 فحص ملف
        </a>

    </div>

</nav>

<main class="container pb-5">

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% for category, message in messages %}

            <div class="flash-error my-2">
                {{ message }}
            </div>

        {% endfor %}

    {% endwith %}

    {% block content %}{% endblock %}

</main>

<footer class="text-center muted pb-4">
    تَحَقَّق | صممت المنصة بواسطة محروس باحسين
</footer>

</body>
</html>
