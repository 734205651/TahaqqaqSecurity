{% extends "base.html" %}

{% block content %}

<section class="glass-card">

    <div class="hero">

        <div class="hero-icon">🛡️</div>

        <h1 class="brand display-5 fw-bold">
            مركز الفحص الأمني
        </h1>

        <p class="muted fs-5 mt-3">
            افحص الروابط والملفات للتحقق من مؤشرات التهديدات الأمنية.
        </p>

        <p class="muted mt-3">
            لا يحتاج المشارك إلى إنشاء حساب أو تسجيل الدخول.
        </p>

    </div>

    <div class="d-grid gap-3">

        <a href="{{ url_for('scan_url') }}"
           class="btn-main">
            🔗 ابدأ فحص رابط
        </a>

        <a href="{{ url_for('scan_file') }}"
           class="btn-secondary-glass">
            📄 فحص ملف
        </a>

    </div>

</section>

{% endblock %}
