
{% extends "base.html" %}

{% block content %}

<section class="panel p-5 text-center mt-4">

    <h1 class="brand">
        مركز الفحص الأمني
    </h1>

    <p class="muted mt-3">
        افحص الروابط والملفات للتحقق من مؤشرات التهديدات الأمنية.
    </p>

    <p class="muted">
        لا يحتاج المشارك إلى إنشاء حساب أو تسجيل الدخول.
    </p>

    <div class="mt-4">

        <a
            class="btn btn-main btn-lg"
            href="{{ url_for('scan_url') }}"
        >
            🔍 ابدأ فحص رابط
        </a>

    </div>

    <div class="mt-3">

        <a
            class="btn btn-outline-info btn-lg"
            href="{{ url_for('scan_file') }}"
        >
            📄 فحص ملف
        </a>

    </div>

</section>

{% endblock %}
